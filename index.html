<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Plus Haute Marche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #050308;
    --deep: #0c0818;
    --violet: #7c5cff;
    --violet-dim: rgba(124,92,255,.35);
    --gold-hi: #fff2c9;
    --gold: #f0b93a;
    --gold-low: #8a5a12;
    --silver-hi: #eef3f8;
    --silver: #a9b6c4;
    --silver-low: #4c5763;
    --bronze-hi: #f0b087;
    --bronze: #b8703e;
    --bronze-low: #5c3418;
    --ink: #f7f2e7;
    --ink-dim: rgba(247,242,231,.55);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(124,92,255,.16), transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(240,185,58,.10), transparent 60%),
      var(--void);
    overflow:hidden;
    color: var(--ink);
    font-family:'Space Mono', monospace;
  }

  .stage{
    position:relative;
    width:100%; height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
    overflow:hidden;
  }

  /* Etoiles ambiantes */
  .dust{
    position:absolute; border-radius:50%;
    background: var(--gold-hi);
    opacity:.35;
    animation: drift ease-in-out infinite alternate;
    pointer-events:none;
    z-index:1;
  }
  @keyframes drift{
    0%{ transform: translateY(0) translateX(0); }
    100%{ transform: translateY(-24px) translateX(10px); }
  }

  /* Rideau */
  .curtain{
    position:absolute; top:0; bottom:0;
    width:51%;
    background: linear-gradient(90deg, #170a20, #2c1240 45%, #170a20);
    box-shadow: inset -14px 0 34px rgba(0,0,0,.7);
    z-index:6;
    transition: transform 1.5s cubic-bezier(.76,0,.24,1);
  }
  .curtain.left{ left:0; border-radius:0 40% 40% 0/0 12% 12% 0; }
  .curtain.right{ right:0; border-radius:40% 0 0 40%/12% 0 0 12%; }
  .curtain::after{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,.25) 0 8px, transparent 8px 22px);
    mix-blend-mode:multiply;
  }
  /* Tension avant ouverture : léger frémissement */
  .stage.opening .curtain{ animation: curtainShiver .35s ease-in-out 2; }
  @keyframes curtainShiver{
    0%,100%{ transform: translateX(0); }
    50%{ transform: translateX(var(--shiver, 4px)); }
  }
  .stage.opening .curtain.right{ --shiver: -4px; }
  /* Ouverture réelle */
  .stage.open .curtain{ animation:none; }
  .stage.open .curtain.left{ transform: translateX(-102%); }
  .stage.open .curtain.right{ transform: translateX(102%); }

  /* Lasers */
  .laser{
    position:absolute; top:0; left:50%;
    width:2px; height:60vh;
    background: linear-gradient(180deg, var(--violet), transparent 80%);
    opacity:0; transform-origin: top center;
    z-index:2; filter: blur(.5px);
  }
  .stage.revealed .laser{ opacity:.55; animation: sweep 5s ease-in-out infinite; }
  .laser.l1{ animation-delay: 0s; }
  .laser.l2{ background: linear-gradient(180deg, var(--gold), transparent 80%); animation-delay: .6s; }
  .laser.l3{ animation-delay: 1.2s; }
  .laser.l4{ background: linear-gradient(180deg, var(--gold), transparent 80%); animation-delay: 1.8s; }
  @keyframes sweep{
    0%{ transform: rotate(-34deg); }
    50%{ transform: rotate(34deg); }
    100%{ transform: rotate(-34deg); }
  }

  /* Spot central */
  .spotlight{
    position:absolute; top:-15%; left:50%;
    width:75vw; height:130vh;
    transform: translateX(-50%);
    background: conic-gradient(from 180deg at 50% 0%, transparent 42%, rgba(255,242,201,.13) 50%, transparent 58%);
    opacity:0; z-index:1; pointer-events:none;
    transition: opacity 1.4s ease;
  }
  .stage.revealed .spotlight{ opacity:1; }
  .stage.opening .spotlight{ opacity:.55; }

  /* Flashs d'appareil photo */
  .flash{
    position:absolute; border-radius:50%;
    background: radial-gradient(circle, #fff, transparent 70%);
    opacity:0; z-index:7; pointer-events:none;
  }
  @keyframes pop{
    0%{ opacity:0; transform:scale(.3); }
    12%{ opacity:.95; transform:scale(1); }
    100%{ opacity:0; transform:scale(1.4); }
  }

  /* Titraille */
  .title-wrap{
    position:absolute; top:5.5vh; left:50%;
    transform: translateX(-50%);
    text-align:center; z-index:8; width:90vw;
  }
  .eyebrow{
    font-size:.7rem; letter-spacing:.5em; text-transform:uppercase;
    color: var(--violet); opacity:.9; margin-bottom:.6em;
  }
  .eyebrow::before, .eyebrow::after{ content:"—"; margin:0 .6em; opacity:.5; }
  h1{
    margin:0; font-family:'Anton', sans-serif; font-weight:400;
    font-size: clamp(2rem, 6vw, 4.2rem);
    text-transform:uppercase; letter-spacing:.02em; line-height:.95;
    background: linear-gradient(180deg, var(--gold-hi) 10%, var(--gold) 55%, var(--gold-low));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow: 0 0 60px rgba(240,185,58,.3);
    position:relative;
  }
  .subtitle{
    margin:.5em auto 0;
    font-family:'Anton', sans-serif; font-weight:400;
    font-size: clamp(1.6rem, 4.4vw, 3rem);
    text-transform:uppercase;
    letter-spacing:.14em;
    line-height:1;
    background: linear-gradient(180deg, #fff 0%, var(--violet) 55%, #3a2b8c 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow: 0 0 40px rgba(124,92,255,.55);
    position:relative;
    display:inline-block;
    opacity:0;
    transform: translateY(14px) scale(.9);
    transition: opacity .7s ease, transform .7s cubic-bezier(.16,1.3,.35,1);
    transition-delay: 1.4s;
  }
  .stage.revealed .subtitle{
    opacity:1;
    transform: translateY(0) scale(1);
  }
  .subtitle::before, .subtitle::after{
    content:"★";
    display:inline-block;
    color: var(--gold);
    font-size:.5em;
    vertical-align:middle;
    margin:0 .35em;
    text-shadow: 0 0 12px rgba(240,185,58,.8);
  }

  /* Bouton */
  .trigger{
    position:relative; z-index:10; margin-bottom:6vh;
    padding:1.1em 2.6em;
    font-family:'Space Mono', monospace; font-weight:700;
    font-size:.85rem; letter-spacing:.28em; text-transform:uppercase;
    color: var(--void);
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-low));
    border:none; border-radius:999px; cursor:pointer;
    box-shadow: 0 0 0 1px rgba(255,242,201,.4), 0 10px 0 var(--gold-low), 0 18px 34px rgba(0,0,0,.55), 0 0 40px rgba(240,185,58,.35);
    transition: transform .15s ease, box-shadow .15s ease;
    animation: pulse-glow 2.4s ease-in-out infinite;
  }
  @keyframes pulse-glow{
    0%,100%{ box-shadow: 0 0 0 1px rgba(255,242,201,.4), 0 10px 0 var(--gold-low), 0 18px 34px rgba(0,0,0,.55), 0 0 30px rgba(240,185,58,.25); }
    50%{ box-shadow: 0 0 0 1px rgba(255,242,201,.6), 0 10px 0 var(--gold-low), 0 18px 34px rgba(0,0,0,.55), 0 0 55px rgba(240,185,58,.55); }
  }
  .trigger:hover{ transform: translateY(-3px); }
  .trigger:active{ transform: translateY(5px); box-shadow: 0 0 0 1px rgba(255,242,201,.4), 0 4px 0 var(--gold-low), 0 8px 18px rgba(0,0,0,.5); }
  .trigger:focus-visible{ outline:3px solid var(--ink); outline-offset:5px; }
  .stage.revealed .trigger{ opacity:0; pointer-events:none; transition: opacity .4s ease; animation:none; }
  .stage.opening .trigger, .stage.open .trigger{ opacity:0; pointer-events:none; transition: opacity .5s ease; animation:none; }

  /* Sol lumineux */
  .floor-glow{
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:74vw; height:90px;
    background: radial-gradient(ellipse at center, rgba(240,185,58,.55), rgba(124,92,255,.18) 45%, transparent 75%);
    z-index:2; opacity:0; transition: opacity 1.1s ease;
    animation: floorPulse 3.4s ease-in-out infinite;
  }
  .stage.revealed .floor-glow{ opacity:1; }
  @keyframes floorPulse{
    0%,100%{ filter:brightness(1) saturate(1); transform:translateX(-50%) scale(1); }
    50%{ filter:brightness(1.35) saturate(1.15); transform:translateX(-50%) scale(1.06); }
  }

  .podium-ring{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    width:56vw; max-width:620px; height:56vw; max-height:620px;
    border-radius:50%;
    border:1px solid rgba(240,185,58,.35);
    z-index:2; opacity:0;
    transition: opacity 1.4s ease .3s;
    pointer-events:none;
  }
  .podium-ring::before{
    content:""; position:absolute; inset:14px; border-radius:50%;
    border:1px solid rgba(124,92,255,.25);
  }
  .stage.revealed .podium-ring{ opacity:1; animation: ringSpin 40s linear infinite; }
  @keyframes ringSpin{ to{ transform: translateX(-50%) rotate(360deg); } }

  /* ===== PODIUM 3D (fausse extrusion) ===== */
  .podium{
    position:relative; z-index:4;
    display:flex; align-items:flex-end;
    padding-top: 250px; /* espace pour le champion */
  }

  .step{
    position:relative;
    transform: translateY(120%);
    opacity:0;
    transition: transform .95s cubic-bezier(.16,1.3,.35,1), opacity .5s ease;
  }
  .stage.revealed .step{ transform: translateY(0); opacity:1; }
  .stage.revealed .step.gold{ transition-delay:.4s; }
  .stage.revealed .step.silver{ transition-delay:.12s; }
  .stage.revealed .step.bronze{ transition-delay:.62s; }

  .step .box{
    position:relative;
    width: clamp(140px, 17vw, 240px);
  }
  .step.gold .box{ height:270px; }
  .step.silver .box{ height:195px; margin-right:-14px; z-index:2; }
  .step.bronze .box{ height:155px; margin-left:-14px; z-index:1; }
  .step.gold .box{ z-index:3; }

  .step-shadow{
    position:absolute; bottom:-16px; left:50%; transform:translateX(-50%);
    width:88%; height:22px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.65), transparent 72%);
    filter: blur(1px);
    z-index:0;
  }

  .face-front{
    position:relative; width:100%; height:100%;
    background: linear-gradient(180deg, var(--f-hi), var(--f-mid) 30%, var(--f-low));
    box-shadow: inset 0 3px 0 rgba(255,255,255,.5), inset 0 -12px 20px rgba(0,0,0,.35), 0 0 26px var(--f-mid);
    overflow:hidden;
    animation: boxGlow 3.2s ease-in-out infinite;
  }
  .step.silver .face-front{ animation-delay:.5s; }
  .step.bronze .face-front{ animation-delay:1s; }
  @keyframes boxGlow{
    0%,50%,100%{ box-shadow: inset 0 3px 0 rgba(255,255,255,.5), inset 0 -12px 20px rgba(0,0,0,.35), 0 0 22px var(--f-mid); }
    25%{ box-shadow: inset 0 3px 0 rgba(255,255,255,.6), inset 0 -12px 20px rgba(0,0,0,.35), 0 0 48px var(--f-mid); }
  }
  .face-front::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 2px, transparent 2px 7px);
    mix-blend-mode:overlay;
  }
  .side-face{
    position:absolute; top:0; right:-18px; bottom:0; width:18px;
    background: linear-gradient(180deg, var(--f-mid), var(--f-low) 70%, #000 140%);
    filter: brightness(.6);
    transform-origin: left top;
    transform: skewY(38deg);
    box-shadow: inset 0 0 12px rgba(0,0,0,.5);
  }
  .side-face::after{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 2px, transparent 2px 7px);
    mix-blend-mode:overlay;
  }
  .shine{
    position:absolute; top:0; bottom:0; width:40%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    transform: translateX(-160%) skewX(-18deg);
    opacity:0;
  }
  .stage.revealed .shine{ animation: glint 2.6s ease-in-out .2s 1; }
  .step.silver .shine{ animation-delay: .6s !important; }
  .step.bronze .shine{ animation-delay: 1s !important; }
  @keyframes glint{
    0%{ transform: translateX(-160%) skewX(-18deg); opacity:0; }
    35%{ opacity:.9; }
    60%{ transform: translateX(220%) skewX(-18deg); opacity:0; }
    100%{ transform: translateX(220%) skewX(-18deg); opacity:0; }
  }

  .top-face{
    position:absolute; left:0; right:0; top:0;
    height:22px;
    background: linear-gradient(135deg, #fff 0%, var(--f-hi) 30%, var(--f-mid) 100%);
    transform-origin: bottom;
    transform: perspective(300px) rotateX(55deg) translateY(-11px);
    border-radius: 2px 2px 0 0;
    box-shadow: inset 0 -2px 6px rgba(0,0,0,.15);
  }

  .rank{
    position:absolute; top:30px; left:0; right:0;
    text-align:center;
    font-family:'Anton', sans-serif;
    font-size: clamp(2.6rem, 5.4vw, 4rem);
    line-height:1;
    background: linear-gradient(180deg, #fff 0%, var(--f-hi) 25%, var(--f-low) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke: 1.5px rgba(0,0,0,.4);
    filter: drop-shadow(0 3px 2px rgba(0,0,0,.35)) drop-shadow(0 0 14px var(--f-mid));
  }
  .plate{
    position:absolute; bottom:16px; left:0; right:0;
    text-align:center;
    font-size:.72rem; letter-spacing:.35em; text-transform:uppercase;
    color: rgba(0,0,0,.55);
  }

  .step.gold   { --f-hi: var(--gold-hi);   --f-mid: var(--gold);   --f-low: var(--gold-low); }
  .step.silver { --f-hi: var(--silver-hi); --f-mid: var(--silver); --f-low: var(--silver-low); }
  .step.bronze { --f-hi: var(--bronze-hi); --f-mid: var(--bronze); --f-low: var(--bronze-low); }

  .mini-champ{
    position:absolute; bottom:100%; left:50%;
    transform: translateX(-50%) translateY(40px) scale(.5);
    opacity:0; z-index:5; text-align:center;
    transition: transform .8s cubic-bezier(.18,1.6,.3,1), opacity .5s ease;
    width: 140px;
  }
  .step.silver .mini-champ{ transition-delay:.55s; }
  .step.bronze .mini-champ{ transition-delay:.78s; }
  .stage.revealed .mini-champ{
    transform: translateX(-50%) translateY(0) scale(1);
    opacity:1;
  }
  .mini-champ{
    position:absolute; bottom:100%; left:50%;
    transform: translateX(-50%) translateY(40px) scale(.5);
    opacity:0; z-index:5; text-align:center;
    transition: transform .8s cubic-bezier(.18,1.6,.3,1), opacity .5s ease;
    width: 150px;
  }
  .step.silver .mini-champ{ transition-delay:.55s; }
  .step.bronze .mini-champ{ transition-delay:.78s; }
  .stage.revealed .mini-champ{
    transform: translateX(-50%) translateY(0) scale(1);
    opacity:1;
  }

  /* ---- Petit personnage complet (pas de cercle) ---- */
  .mini-body{ position:relative; width:98px; margin:0 auto; }

  .mini-head-shape{
    width:72px; height:78px; margin:0 auto;
    background: linear-gradient(160deg, #ffd9a8, #ec9f5e);
    border-radius: 50% 50% 46% 46%/56% 56% 44% 44%;
    position:relative; z-index:2;
    box-shadow: inset -7px -9px 15px rgba(0,0,0,.18), 0 8px 16px rgba(0,0,0,.4);
  }
  .mini-ear{ position:absolute; width:12px; height:16px; background:#ec9f5e; border-radius:50%; top:29px; }
  .mini-ear.l{ left:-6px; } .mini-ear.r{ right:-6px; }
  .mini-eye{ position:absolute; width:7px; height:8px; background:#20140c; border-radius:50%; top:34px; }
  .mini-eye.l{ left:22px; } .mini-eye.r{ right:22px; }
  .mini-brow{ position:absolute; width:11px; height:3px; background:#3c2a1e; border-radius:3px; top:27px; }
  .mini-brow.l{ left:20px; transform:rotate(-6deg); }
  .mini-brow.r{ right:20px; transform:rotate(6deg); }
  .mini-cheek{ position:absolute; width:9px; height:6px; background:rgba(255,120,120,.35); border-radius:50%; top:47px; }
  .mini-cheek.l{ left:13px; } .mini-cheek.r{ right:13px; }
  .mini-mouth{
    position:absolute; bottom:15px; left:50%; transform:translateX(-50%);
    width:20px; height:9px; border-bottom:3px solid #7a3b2a; border-radius:0 0 13px 13px;
  }

  /* Garçon : cheveux courts */
  .mini-head-shape.boy .mini-hair{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:78px; height:32px;
    background: linear-gradient(160deg,#3c2a1e,#1a120c);
    border-radius:50% 50% 35% 35%/70% 70% 20% 20%;
    z-index:3;
  }
  .mini-head-shape.boy .mini-hair::after{
    content:""; position:absolute; bottom:-5px; left:6px; right:6px; height:7px;
    background:#1a120c; border-radius:0 0 40% 40%;
  }

  /* Fille : peau claire, cheveux longs + noeud */
  .mini-head-shape.girl{
    background: linear-gradient(160deg, #fff3ea, #f3d8c4);
    overflow:visible;
  }
  .mini-head-shape.girl .mini-hair{
    position:absolute; top:-12px; left:50%; transform:translateX(-50%);
    width:104px; height:150px;
    background: linear-gradient(170deg,#8a5a2e 0%,#5c3a1a 55%,#3f280f 100%);
    border-radius:50% 50% 45% 45%/55% 55% 45% 45%;
    z-index:0;
  }
  .mini-head-shape.girl .mini-fringe{
    position:absolute; top:-7px; left:50%; transform:translateX(-50%);
    width:74px; height:30px;
    background: linear-gradient(160deg,#8a5a2e,#3f280f);
    border-radius:50% 50% 40% 40%/70% 70% 20% 20%;
    z-index:3;
  }
  .mini-head-shape.girl .mini-strand{
    position:absolute; top:30px; width:28px; height:108px;
    background: linear-gradient(180deg,#9a6a36,#5c3a1a 55%,#3f280f);
    border-radius: 50% 50% 60% 60%/35% 35% 65% 65%;
    z-index:1;
    box-shadow: inset 3px 0 6px rgba(0,0,0,.25);
  }
  .mini-head-shape.girl .mini-strand.l{ left:-19px; transform:rotate(-9deg); }
  .mini-head-shape.girl .mini-strand.r{ right:-19px; transform:rotate(9deg) scaleX(-1); }
  .mini-head-shape.girl .mini-bow{
    position:absolute; top:-16px; left:60%;
    width:20px; height:14px; z-index:4;
  }
  .mini-head-shape.girl .mini-bow::before, .mini-head-shape.girl .mini-bow::after{
    content:""; position:absolute; top:0; width:10px; height:12px;
    background: var(--violet); border-radius:60% 60% 60% 0/60% 60% 0 60%;
  }
  .mini-head-shape.girl .mini-bow::before{ left:0; transform:rotate(-20deg); }
  .mini-head-shape.girl .mini-bow::after{ right:0; transform:scaleX(-1) rotate(-20deg); }

  /* Torse + jambes du petit personnage */
  .mini-torso{
    width:88px; height:50px; margin:-5px auto 0;
    border-radius:40% 40% 6% 6%/70% 70% 8% 8%;
    position:relative; z-index:1;
    box-shadow: inset 0 4px 8px rgba(255,255,255,.18);
  }
  .step.silver .mini-torso{ background: linear-gradient(180deg, var(--silver-hi), var(--silver) 60%, var(--silver-low)); }
  .step.bronze .mini-torso{ background: linear-gradient(180deg, var(--bronze-hi), var(--bronze) 60%, var(--bronze-low)); }
  .mini-torso::after{
    content:""; position:absolute; left:50%; top:6px; transform:translateX(-50%);
    width:22px; height:22px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff6df, var(--gold) 60%, var(--gold-low));
    box-shadow: 0 0 10px rgba(240,185,58,.7);
  }
  .mini-legs{ display:flex; justify-content:center; gap:8px; margin-top:-3px; }
  .mini-leg{ width:18px; height:24px; border-radius:0 0 7px 7px; }
  .step.silver .mini-leg{ background: linear-gradient(180deg, var(--silver-low), #2b323a); }
  .step.bronze .mini-leg{ background: linear-gradient(180deg, var(--bronze-low), #2e1a0c); }

  .mini-name{
    margin-top:.5em;
    font-family:'Space Mono', monospace; font-weight:700;
    font-size:.72rem; letter-spacing:.08em; text-transform:uppercase;
    color: var(--ink);
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  .mini-score{
    margin-top:.15em;
    font-family:'Anton', sans-serif;
    font-size:1.5rem; line-height:1;
    color: var(--rim, var(--silver));
    text-shadow: 0 0 16px rgba(0,0,0,.5);
  }
  .champ-score{
    margin-top:.3em;
    text-align:center;
    font-family:'Anton', sans-serif;
    font-size:1.9rem; line-height:1;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(240,185,58,.75);
  }
  .score{
    position:absolute; top:34px; left:0; right:0;
    text-align:center;
    font-family:'Anton', sans-serif;
    font-size: clamp(1.6rem, 3.2vw, 2.4rem);
    color: rgba(0,0,0,.4);
    line-height:1;
  }
  .champion{
    position:absolute; bottom:100%; left:50%;
    transform: translateX(-50%) translateY(50px) scale(.55);
    opacity:0; z-index:5;
    transition: transform .85s cubic-bezier(.18,1.6,.3,1), opacity .5s ease;
    transition-delay: 1.05s;
  }
  .stage.revealed .champion{
    transform: translateX(-50%) translateY(0) scale(1);
    opacity:1;
    animation: bob 3.6s ease-in-out infinite 2s;
  }
  @keyframes bob{
    0%,100%{ transform: translateX(-50%) translateY(0) scale(1); }
    50%{ transform: translateX(-50%) translateY(-12px) scale(1); }
  }

  .rays{
    position:absolute; top:-70px; left:50%;
    width:280px; height:280px;
    transform: translate(-50%,0);
    z-index:-1;
    opacity:.55;
    animation: spin 24s linear infinite;
  }
  @keyframes spin{ to{ transform: translate(-50%,0) rotate(360deg); } }

  .head{
    width:128px; height:128px;
    border-radius:50%;
    position:relative; margin:0 auto;
    box-shadow: 0 0 0 6px var(--gold), 0 0 0 8px var(--gold-low), 0 14px 30px rgba(0,0,0,.55);
    overflow:hidden;
  }
  .head img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .sparkle{ position:absolute; font-size:1.1rem; color:var(--gold-hi); opacity:0; }
  .stage.revealed .sparkle{ animation: twinkle 1.8s ease-in-out infinite; }
  .sp1{ top:-6px; left:-26px; animation-delay:.2s !important; }
  .sp2{ top:20px; right:-30px; animation-delay:.9s !important; }
  .sp3{ bottom:10px; left:-34px; animation-delay:1.4s !important; }
  @keyframes twinkle{
    0%,100%{ opacity:0; transform:scale(.6) rotate(0deg); }
    50%{ opacity:1; transform:scale(1.15) rotate(20deg); }
  }

  .crown{
    position:absolute; top:-34px; left:50%; transform:translateX(-50%);
    width:86px; filter: drop-shadow(0 5px 8px rgba(0,0,0,.45));
  }

  .torso{
    width:142px; height:66px; margin:-6px auto 0;
    background: linear-gradient(180deg, #6a4fe0, #372a86);
    border-radius:42% 42% 0 0/62% 62% 0 0;
    position:relative;
    box-shadow: inset 0 4px 8px rgba(255,255,255,.15);
  }
  .sash{
    position:absolute; top:0; left:20%; width:26px; height:100%;
    background: linear-gradient(180deg,#ff5c5c,#a51f1f);
    transform: skewX(-18deg);
    opacity:.9;
  }
  .medal{
    position:absolute; left:50%; top:8px; transform:translateX(-50%);
    width:28px; height:28px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff6df, var(--gold) 60%, var(--gold-low));
    box-shadow: 0 0 16px rgba(240,185,58,.8);
  }
  .medal::before{
    content:""; position:absolute; top:-16px; left:50%; transform:translateX(-50%);
    width:4px; height:16px; background:var(--gold-low);
  }

  /* M&M's qui tombent */
  .confetti{
    position:absolute; top:-14px; opacity:0; z-index:8; pointer-events:none;
    border-radius:50%;
    box-shadow:
      inset -4px -5px 6px rgba(0,0,0,.4),
      inset 3px 4px 5px rgba(255,255,255,.55),
      0 3px 7px rgba(0,0,0,.4);
  }
  .confetti::after{
    content:"m";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono', monospace; font-weight:700; font-style:italic;
    color:#fff; opacity:.9;
    text-shadow:0 1px 1px rgba(0,0,0,.35);
  }
  .stage.revealed .confetti{ animation: fall linear forwards; }
  @keyframes fall{
    0%{ opacity:1; transform: translateY(0) rotate(0deg); }
    100%{ opacity:.9; transform: translateY(108vh) rotate(540deg); }
  }

  /* Applaudissements */
  .clap-emoji{
    position:absolute; z-index:9; opacity:0; pointer-events:none;
    animation: clapRise ease-out forwards;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.5));
  }
  @keyframes clapRise{
    0%{ opacity:0; transform: translateY(0) scale(.5) rotate(-10deg); }
    18%{ opacity:1; transform: translateY(-20px) scale(1.05) rotate(6deg); }
    55%{ opacity:1; transform: translateY(-70px) scale(1) rotate(-6deg); }
    100%{ opacity:0; transform: translateY(-150px) scale(.85) rotate(4deg); }
  }
  .bravo{
    position:absolute; top:38%; left:50%;
    transform: translate(-50%,-50%) scale(.6);
    z-index:9; opacity:0; pointer-events:none;
    font-family:'Anton', sans-serif; text-transform:uppercase;
    font-size: clamp(2rem, 7vw, 5rem);
    letter-spacing:.06em;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-low));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow: 0 0 60px rgba(240,185,58,.6);
  }
  .bravo.pop{ animation: bravoPop 1.8s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes bravoPop{
    0%{ opacity:0; transform: translate(-50%,-50%) scale(.4) rotate(-4deg); }
    18%{ opacity:1; transform: translate(-50%,-50%) scale(1.12) rotate(2deg); }
    30%{ transform: translate(-50%,-50%) scale(1) rotate(0deg); }
    78%{ opacity:1; }
    100%{ opacity:0; transform: translate(-50%,-50%) scale(1.05) rotate(0deg); }
  }

  .replay{
    position:absolute; bottom:4vh; right:4vw; z-index:10;
    background:transparent; border:1px solid rgba(247,242,231,.3);
    color:var(--ink); font-family:'Space Mono',monospace; font-size:.72rem;
    letter-spacing:.25em; text-transform:uppercase;
    padding:.7em 1.3em; border-radius:999px; cursor:pointer;
    opacity:0; pointer-events:none;
    transition: opacity .5s ease .7s, border-color .2s, color .2s;
  }
  .stage.revealed .replay{ opacity:.8; pointer-events:auto; }
  .replay:hover{ border-color:var(--gold); color:var(--gold); }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  @media (max-width:640px){
    .curtain{ width:51%; }
    .podium{ padding-top:200px; }
    .head{ width:92px; height:100px; }
    h1{ font-size:1.7rem; }
    .subtitle{ font-size: clamp(1.1rem, 6vw, 2rem); }
  }
</style>
</head>

        <div class="torso">
          <div class="sash"></div>
          <div class="medal"></div>
        </div>
        <div class="champ-score">14</div>
      </div>
      <div class="step-shadow"></div>
      <div class="box">
        <div class="top-face"></div>
        <div class="face-front"><div class="shine"></div></div>
        <div class="side-face"></div>
        <div class="rank">1</div>
        <div class="plate">Or</div>
      </div>
    </div>

    <div class="step bronze">
      <div class="mini-champ">
        <div class="mini-body">
          <div class="mini-head-shape boy">
            <div class="mini-hair"></div>
            <div class="mini-ear l"></div><div class="mini-ear r"></div>
            <div class="mini-brow l"></div><div class="mini-brow r"></div>
            <div class="mini-eye l"></div><div class="mini-eye r"></div>
            <div class="mini-cheek l"></div><div class="mini-cheek r"></div>
            <div class="mini-mouth"></div>
          </div>
          <div class="mini-torso"></div>
          <div class="mini-legs"><div class="mini-leg"></div><div class="mini-leg"></div></div>
        </div>
        <div class="mini-name">Philippe Jarsaillon </div>
        <div class="mini-score">3</div>
      </div>
      <div class="step-shadow"></div>
      <div class="box">
        <div class="top-face"></div>
        <div class="face-front"><div class="shine"></div></div>
        <div class="side-face"></div>
        <div class="rank">3</div>
        <div class="plate">Bronze</div>
      </div>
    </div>

  </div>

  <button class="replay" id="replayBtn">Rejouer</button>
</div>

<script>
  const stage = document.getElementById('stage');
  const triggerBtn = document.getElementById('triggerBtn');
  const replayBtn = document.getElementById('replayBtn');

  const confettiColors = ['#e2231a','#f9d923','#2fa84f','#1a75d1','#f57f17','#6b3e1f'];

  function launchConfetti(){
    const count = 60;
    for(let i=0;i<count;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      const left = Math.random()*100;
      const size = 16 + Math.random()*10;
      const duration = 4.6 + Math.random()*3.2;
      const delay = Math.random()*0.7;
      const color = confettiColors[Math.floor(Math.random()*confettiColors.length)];
      c.style.left = left + 'vw';
      c.style.width = size + 'px';
      c.style.height = size + 'px';
      c.style.fontSize = (size*0.55) + 'px';
      c.style.background = color;
      c.style.animationDuration = duration + 's';
      c.style.animationDelay = delay + 's';
      stage.appendChild(c);
      setTimeout(() => c.remove(), (duration+delay)*1000 + 200);
    }
  }

  function launchDust(){
    for(let i=0;i<26;i++){
      const d = document.createElement('div');
      d.className = 'dust';
      const size = 1.5 + Math.random()*2.5;
      d.style.width = size+'px';
      d.style.height = size+'px';
      d.style.left = Math.random()*100+'vw';
      d.style.top = Math.random()*100+'vh';
      d.style.animationDuration = (3+Math.random()*4)+'s';
      stage.appendChild(d);
    }
  }

  function launchFlashes(n){
    for(let i=0;i<n;i++){
      setTimeout(() => {
        const f = document.createElement('div');
        f.className = 'flash';
        const size = 60 + Math.random()*100;
        f.style.width = size+'px';
        f.style.height = size+'px';
        f.style.left = (10 + Math.random()*80)+'vw';
        f.style.top = (10 + Math.random()*70)+'vh';
        f.style.animation = 'pop .6s ease-out forwards';
        stage.appendChild(f);
        setTimeout(() => f.remove(), 700);
      }, i*350 + Math.random()*300);
    }
  }

  let pendingTimers = [];
  function after(ms, fn){ pendingTimers.push(setTimeout(fn, ms)); }
  function clearPending(){ pendingTimers.forEach(clearTimeout); pendingTimers = []; }

  /* ---- Applaudissements : mains visuelles ---- */
  function launchApplauseEmojis(){
    const count = 40;
    for(let i=0;i<count;i++){
      after(i*120 + Math.random()*160, () => {
        const e = document.createElement('div');
        e.className = 'clap-emoji';
        e.textContent = '👏';
        e.style.left = (6 + Math.random()*88) + 'vw';
        e.style.bottom = (Math.random()*8) + 'vh';
        e.style.fontSize = (1.3 + Math.random()*1.4) + 'rem';
        e.style.animationDuration = (1.7 + Math.random()*.9) + 's';
        stage.appendChild(e);
        setTimeout(() => e.remove(), 2900);
      });
    }
  }

  function showBravo(){
    const b = document.createElement('div');
    b.className = 'bravo pop';
    b.textContent = 'BRAVO !';
    stage.appendChild(b);
    setTimeout(() => b.remove(), 1900);
  }

  /* ---- Applaudissements : son synthétisé (aucun fichier externe) ---- */
  let audioCtx;
  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playClap(time, gain){
    if(!audioCtx) return;
    const bufferSize = Math.floor(audioCtx.sampleRate * 0.045);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const band = audioCtx.createBiquadFilter();
    band.type = 'bandpass';
    band.frequency.value = 1400 + Math.random()*1800;
    band.Q.value = 0.9;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(gain, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
    noise.connect(band).connect(g).connect(audioCtx.destination);
    noise.start(time);
  }
  function playApplause(duration){
    if(!audioCtx) return;
    const now = audioCtx.currentTime + 0.02;
    let t = now;
    while(t < now + duration){
      playClap(t, 0.12 + Math.random()*0.16);
      t += 0.02 + Math.random()*0.06;
    }
  }

  /* ---- Séquence complète : rideau -> suspense -> podium -> applaudissements ---- */
  function reveal(){
    ensureAudio();
    stage.classList.add('opening'); // frémissement des rideaux, tension qui monte

    after(750, () => {
      stage.classList.add('open'); // les rideaux glissent complètement (1.5s)
    });

    after(2500, () => {
      stage.classList.add('revealed');
      launchConfetti();
      after(900, launchConfetti);
      launchFlashes(6);
    });

    after(10800, () => {
      launchApplauseEmojis();
      showBravo();
      playApplause(5.2);
    });
  }

  function reset(){
    clearPending();
    stage.classList.remove('revealed', 'opening', 'open');
    document.querySelectorAll('.confetti, .flash, .clap-emoji, .bravo').forEach(el => el.remove());
  }

  triggerBtn.addEventListener('click', reveal);
  replayBtn.addEventListener('click', () => {
    reset();
    setTimeout(reveal, 250);
  });

  launchDust();
</script>
